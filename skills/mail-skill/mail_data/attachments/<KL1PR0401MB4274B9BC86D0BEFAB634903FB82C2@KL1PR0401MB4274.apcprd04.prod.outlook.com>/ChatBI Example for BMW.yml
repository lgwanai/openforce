            \                                                                    \
            \      \n  - **严禁使用函数定义中未提及的语法变体或别名**。                               \
            \                                   \n  - 如果需要某个函数但未在定义中找到，使用基础函数组合实现，不要臆造。\
            \                                              \n                    \
            \                                                                    \
            \                            \n  ## 禁止事项                             \
            \                                                                    \
            \      \n  - ❌ 禁止使用 `QUARTER`、`WEEK` 作为 INTERVAL 单位（DuckDB 不支持）。     \
            \                                        \n  - ❌ 禁止使用错误的函数签名。        \
            \                                                                    \
            \         \n  - ❌ 禁止使用未定义的函数别名。                                      \
