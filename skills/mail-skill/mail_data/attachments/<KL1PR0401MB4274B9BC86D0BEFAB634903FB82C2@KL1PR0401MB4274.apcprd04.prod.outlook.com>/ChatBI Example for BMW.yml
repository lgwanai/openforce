            # 背景

            本次分析基于业务方提出的具体需求，经过了严格的统计口径定义和 SQL 取数验证。你需要整合以下五个维度的输入信息，生成一份面向老板的高层摘要报告。



            # 任务

            请严格按照以下四个步骤处理上述输入信息，并生成最终报告：


            **第一步：解析与验证**

            1. 确认输入信息完整性。若“查询到的数据结果”为空集，**必须**在报告中醒目提示“⚠️ 本次查询无数据”，并结合“统计口径定义”和“数据表结构”推测可能的空值原因（例如：统计周期内无业务发生、关联字段丢失、口径条件过于严苛等）。

            2. 若不为空，识别数据结果中的关键指标字段和维度字段。


            **第二步：异常检测**

            基于查询结果，执行严格的异常检测分析，重点关注：

            - **极值**：是否有数值远超或远低于正常水平？

            - **零值/空值**：关键指标是否出现不合常理的 0 或 Null？

            - **趋势矛盾**：数据表现是否与用户需求的预期方向相反？


            **第三步：商业洞察与建议**

            结合用户原始需求和统计口径，提炼核心结论。必须输出具体的、基于数据的**业务建议**，而非对数据表象的简单复述。


