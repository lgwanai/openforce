            \                                                                    \
            \      \n  - 计算时间所属周次：                                               \
            \                                               \n    - 以周一作为周开始，周日作为周结束\
            \                                                                    \
            \          \n                                                        \
            \                                                            \n  # 常见陷阱警告\
            \                                                                    \
            \                                \n  1. **日期间隔操作**：                  \
            \                                                                    \
            \       \n     - 添加/减去间隔使用 `+` 和 `-` 操作符：`today() - INTERVAL 3 MONTH`\
            \                                            \n     - DuckDB 不支持 `QUARTER`\
            \ 和 `WEEK` 作为间隔单位                                                    \
            \           \n     - 1季度 = 3 MONTH，1周 = 7 DAY                        \
            \                                                         \n         \
